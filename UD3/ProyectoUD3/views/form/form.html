<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="form.css">
    <title>Reporte de Incidencia - ZonaBit</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div id="contact-container">
        <h2>Reporte de Incidencia</h2>
        <p>¿Tienes algún problema con alguno de nuestros productos? Rellena el formulario con los detalles y selecciona la categoría correspondiente.</p>
        <form action="../../controllers/FormController.php" method="post">
            <div class="form-group">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" placeholder="Tu nombre completo" required>
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Tu correo electrónico" required>
            </div>
            <div class="form-group">
                <label for="telefono">Teléfono:</label>
                <input type="tel" id="telefono" name="telefono" placeholder="Tu número de teléfono" required pattern="[0-9]{9}">
            </div>
            <div class="form-group">
                <label for="direccion">Dirección:</label>
                <input type="text" id="direccion" name="direccion" placeholder="Tu dirección (opcional)">
            </div>
            <div class="form-group">
                <label for="categoria">Categoría del Producto:</label>
                <select id="categoria" name="categoria" required>
                    <option value="" disabled selected>Selecciona una categoría</option>
                    <option value="portatiles">Portátiles</option>
                    <option value="sobremesas">Sobremesas</option>
                    <option value="smartphones">Smartphones</option>
                    <option value="TV">TV</option>
                    <option value="perifericos">Periféricos</option>
                    <option value="memorias">Memorias</option>
                    <option value="smartwatches">Smartwatches</option>
                    <option value="otro">Otro</option>
                </select>
            </div>
            <div class="form-group">
                <label for="fecha-compra">Fecha de Compra:</label>
                <input type="date" id="fecha-compra" name="fecha-compra" required>
            </div>
            <div class="form-group">
                <label for="mensaje">Descripción del Problema:</label>
                <textarea id="mensaje" name="mensaje" placeholder="Nombre y describe el problema con el producto..." required></textarea>
            </div>
            <button type="submit"><i class="fas fa-paper-plane"></i> Enviar Incidencia</button>
        </form>

        <div class="redirect">
            <button onclick="window.location.href='../../index.php';"><i class="fas fa-home"></i> Volver al Inicio</button>
        </div>
    </div>
</body>
</html>
